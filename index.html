<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha512-Fo3rlrZj/k7ujTnHg4CGR2D7kSs0v4LLanw2qksYuRlEzO+tcaEPQogQ0KaoGN26/zrn20ImR1DfuLWnOo7aBA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="./styles/styles.css" rel="stylesheet">
    
    <title>Dev Burguer</title>
</head>
<body>
    
    <!-- HEADER -->
    <header>
        <div class="header-container">
          <img src="./assets/hamb-1.png" alt="Logo DevBurguer">
          <h1>Dev Burguer</h1>
          <span>Rua dev 10, Campo Grande - RJ</span>
          <span id="date-span">Seg à Dom - 18:00 as 22:00</span>  
        </div>
    </header>  
    <!-- FIM HEADER -->

    <h2>Conheça nosso menu</h2>

    <!-- INICIO MENU -->

        <main class="grid">

        <div id="menu">

            <img src="./assets/hamb-1.png" alt="Hamburguer1" class="w-28 "/>

            <div class="produto">
                <p>Hamburguer Smash</p>
                <p>Pão brioche, burger 160g, queijo prato e maionese da casa.</p>

                <div class="preco">
                    <p class="price-text">R$ 18.90</p>
                    <button 
                        class="add-to-cart-btn"
                        data-name="Hamburguer Smash"
                        data-price="18.90">
                        <i class="fa fa-cart-plus text-lg"></i>
                    </button>
                </div>
            </div>

            <img src="./assets/hamb-2.png" alt="Hamburguer2" class="w-28 "/>
    
            <div class="produto">
                <p>Hamburguer Duplo</p>
                <p>Pão brioche, burger 160g, queijo prato e maionese da casa.</p>
    
                <div class="preco">
                    <p class="price-text">R$ 32.90</p>
                    <button 
                        class="add-to-cart-btn"
                        data-name="Hamburguer Duplo"
                        data-price="32.90">
                        <i class="fa fa-cart-plus text-lg"></i>
                    </button>
                </div>            

            </div>

        </div>
    
        </main>

    </div>

    <!-- FIM MENU -->

</body>
</html>
